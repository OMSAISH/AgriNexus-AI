<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" style="background:#FFFFFF; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <rect x="10" y="10" width="860" height="400" rx="10" fill="#FAFBF8" stroke="#CBD5E1" stroke-width="1.5"/>
